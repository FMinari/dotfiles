"$schema" = 'https://starship.rs/config-schema.json'
palette = "noctalia"
# Prompt estilo "powerline". As cores (blue, pink, cyan…) vêm da paleta
# que o Noctalia injeta no fim deste arquivo — troca o tema no Noctalia e o
# prompt acompanha. Docs: https://starship.rs/config/

add_newline = true

format = """
[](fg:red)\
[ 󰣇 ](bg:red fg:base)\
[](bg:magenta fg:red)\
$directory\
[](fg:magenta bg:surface1)\
$git_branch\
$git_status\
[](fg:surface1 bg:base)\
$nodejs$python$rust$golang\
$cmd_duration\
$line_break\
$character"""

[directory]
style = "bg:magenta fg:base bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documentos" = "󰈙 "
"Downloads" = " "
"Imagens" = " "
"trabalho" = "󰃖 "
"pessoal" = " "

[git_branch]
symbol = ""
style = "bg:surface1 fg:yellow"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "bg:surface1 fg:yellow"
format = "[($all_status$ahead_behind )]($style)"

[nodejs]
symbol = ""
format = "[ $symbol $version](fg:green) "

[python]
symbol = ""
format = "[ $symbol $version](fg:yellow) "

[rust]
symbol = ""
format = "[ $symbol $version](fg:red) "

[golang]
symbol = ""
format = "[ $symbol $version](fg:cyan) "

[cmd_duration]
min_time = 2000
format = "[ 󱦟 $duration](fg:overlay2) "

[character]
success_symbol = "[❯](bold yellow)"
error_symbol = "[❯](bold red)"

# >>> NOCTALIA STARSHIP PALETTE >>>
