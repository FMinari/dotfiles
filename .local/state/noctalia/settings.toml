config_version = 14

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [ "relogio", "data", "clima", "calendario", "sistema", "musica" ]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.calendario]
    cx = 1140.0
    cy = 240.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "calendar"

        [desktop_widgets.widget.calendario.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.69999999999999996
        show_events = false
        show_week_numbers = false

    [desktop_widgets.widget.clima]
    cx = 250.0
    cy = 335.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "weather"

        [desktop_widgets.widget.clima.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.69999999999999996
        color = "on_surface"
        forecast_days = 3
        shadow = true
        show_forecast = true

    [desktop_widgets.widget.data]
    box_height = 34.0
    box_width = 380.0
    cx = 250.0
    cy = 222.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "clock"

        [desktop_widgets.widget.data.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        format = "{:%A, %d de %B}"
        shadow = true

    [desktop_widgets.widget.musica]
    cx = 250.0
    cy = 560.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "media_player"

        [desktop_widgets.widget.musica.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.69999999999999996
        color = "on_surface"
        hide_when_no_media = true
        layout = "horizontal"
        shadow = true

    [desktop_widgets.widget.relogio]
    box_height = 130.0
    box_width = 380.0
    cx = 250.0
    cy = 140.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "clock"

        [desktop_widgets.widget.relogio.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "primary"
        font_family = "Monoton"
        format = "{:%H:%M}"
        shadow = true

    [desktop_widgets.widget.sistema]
    box_height = 110.0
    box_width = 300.0
    cx = 1140.0
    cy = 540.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "sysmon"

        [desktop_widgets.widget.sistema.settings]
        background = true
        background_color = "surface"
        background_opacity = 0.69999999999999996
        color = "primary"
        color2 = "secondary"
        display = "graph"
        shadow = true
        show_label = true
        stat = "cpu_usage"
        stat2 = "ram_pct"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lock-anel", "lock-relogio", "lock-data", "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget.lock-anel]
    box_height = 440.0
    box_width = 440.0
    cx = 683.0
    cy = 225.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "fancy_audio_visualizer"

        [lockscreen_widgets.widget.lock-anel.settings]
        background = false
        fade_when_idle = true
        primary_color = "primary"
        rotation_speed = 0.29999999999999999
        secondary_color = "secondary"
        sensitivity = 1.3999999999999999
        visualization_mode = "bars_rings"

    [lockscreen_widgets.widget.lock-data]
    box_height = 40.0
    box_width = 520.0
    cx = 683.0
    cy = 318.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "clock"

        [lockscreen_widgets.widget.lock-data.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "on_surface"
        format = "{:%A, %d de %B}"
        shadow = true

    [lockscreen_widgets.widget.lock-relogio]
    box_height = 190.0
    box_width = 620.0
    cx = 683.0
    cy = 205.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    type = "clock"

        [lockscreen_widgets.widget.lock-relogio.settings]
        background = false
        center_text = true
        clock_style = "digital"
        color = "primary"
        font_family = "Monoton"
        format = "{:%H:%M}"
        shadow = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 560.0
    cx = 683.0
    cy = 600.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface"
        background_opacity = 0.55000000000000004
        background_radius = 20.0
        center_password_text = true
        input_opacity = 0.84999999999999998
        input_radius = 14.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = false
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[theme]
builtin = "Tokyo-Night"
custom_palette = "Vaporwave"
source = "custom"

[wallpaper.default]
path = "/home/feminari/Imagens/Wallpapers/vaporwave/palmeiras-roxas.jpg"

[wallpaper.last]
path = "/home/feminari/Imagens/Wallpapers/vaporwave/palmeiras-roxas.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/feminari/Imagens/Wallpapers/vaporwave/palmeiras-roxas.jpg"